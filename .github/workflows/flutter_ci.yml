name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-test-build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform klasörleri (android/ios) repoya konmaz; CI'da üretilir.
      # Mevcut lib/, pubspec, assets korunur.
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.example .

      # Bazı eklentiler (flutter_plugin_android_lifecycle) compileSdk 36 ister.
      # App modülünü sed ile, TÜM eklenti alt-projelerini (file_picker vb.)
      # kök build.gradle.kts'e eklenen subprojects bloğuyla 36'ya yükselt.
      - name: Force compileSdk/targetSdk 36 (app + all plugins)
        run: |
          f=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$f"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$f"
          cat ../.github/ci/force_compile_sdk.gradle.kts >> android/build.gradle.kts
          echo "--- android/app/build.gradle.kts (android bloğu) ---"
          grep -nE 'compileSdk|targetSdk|minSdk' "$f" || true
          echo "--- android/build.gradle.kts (son satırlar) ---"
          tail -25 android/build.gradle.kts || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notaoyun-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
