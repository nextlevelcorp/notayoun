name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-test-build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform klasörleri (android/ios) repoya konmaz; CI'da üretilir.
      # Mevcut lib/, pubspec, assets korunur.
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.example .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notaoyun-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
