name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-test-build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform klasörleri (android/ios) repoya konmaz; CI'da üretilir.
      # Mevcut lib/, pubspec, assets korunur.
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.example .

      # App modülü: flutter create varsayılanı compileSdkVersion 34 üretir.
      - name: Patch app compileSdk/targetSdk to 36
        run: |
          f=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$f"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$f"
          grep -nE 'compileSdk|targetSdk|minSdk' "$f" || true

      - name: Install dependencies
        run: flutter pub get

      # Eklenti alt-projeleri kendi compileSdk'sini sabit kodlayabiliyor
      # (ör. file_picker 8.3.7 → `compileSdk 34`). flutter_plugin_android_lifecycle
      # tüketicilerden 36 ister. Pub-cache'deki build.gradle dosyalarında
      # compileSdk/compileSdkVersion 30–35 değerlerini 36'ya yükselt.
      - name: Patch plugin subprojects compileSdk to 36
        run: |
          find "$PUB_CACHE/hosted/pub.dev" -name build.gradle \
            -exec perl -i -pe 's/(compileSdk(?:Version)?\s*=?\s*)3[0-5]\b/${1}36/g' {} +
          echo "--- compileSdk satırları (eklentiler) ---"
          grep -rnE 'compileSdk' "$PUB_CACHE/hosted/pub.dev"/*/android/build.gradle 2>/dev/null \
            | grep -v 'flutter\.compileSdkVersion' | head -30 || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notaoyun-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
