# Codemagic CI/CD — NotaOyun
# Mac'siz iOS + Android derleme. Sırlar (Apple/Google anahtarları) Codemagic
# ortam değişkenlerinde / gruplarında tutulur; repoya KONMAZ.
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/

workflows:
  android-apk:
    name: Android APK (test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        # OMR backend URL'i build'e gömülür (tanımsızsa uygulama mock'a düşer)
        OMR_BASE_URL: "https://notaoyun-omr.onrender.com"
    scripts:
      - name: Generate platform folders
        script: |
          cd app
          flutter create --platforms=android,ios --org com.example .
      - name: Patch app compileSdk/targetSdk/minSdk
        script: |
          cd app
          f=android/app/build.gradle.kts
          sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$f" || \
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$f"
          sed -i '' 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$f" || \
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$f"
          sed -i '' 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f" || \
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$f"
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Patch plugin subprojects compileSdk to 36
        script: |
          PUB_CACHE="${HOME}/.pub-cache"
          # file_picker vb. eklentiler compileSdk'yi sabit kodlar (ör. 34);
          # flutter_plugin_android_lifecycle 36 ister. 30–35 → 36.
          find "$PUB_CACHE/hosted/pub.dev" -name build.gradle \
            -exec perl -i -pe 's/(compileSdk(?:Version)?\s*=?\s*)3[0-5]\b/${1}36/g' {} +
      - name: Analyze
        script: |
          cd app
          flutter analyze
      - name: Test
        script: |
          cd app
          flutter test
      - name: Build APK
        script: |
          cd app
          flutter build apk --release --dart-define=OMR_BASE_URL=$OMR_BASE_URL
    artifacts:
      - app/build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - utkucankumru@gmail.com  # placeholder — kendi e-postanı koy

  ios-testflight:
    name: iOS IPA → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic  # App Store Connect API anahtarı (Codemagic'te tanımla)
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.notaoyun  # placeholder — kendi bundle id'in
      vars:
        OMR_BASE_URL: "https://notaoyun-omr.onrender.com"
    scripts:
      - name: Generate platform folders
        script: |
          cd app
          flutter create --platforms=android,ios --org com.example .
      - name: Add microphone usage description (Info.plist)
        script: |
          cd app
          plist=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'Çaldığın notaları dinleyip oyunda yönlendirmek için mikrofon kullanılır. Ses kaydedilmez.'" \
            "$plist" || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSMicrophoneUsageDescription 'Çaldığın notaları dinleyip oyunda yönlendirmek için mikrofon kullanılır. Ses kaydedilmez.'" \
            "$plist"
      - name: Get Flutter packages
        script: |
          cd app
          flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Analyze & test
        script: |
          cd app
          flutter analyze
          flutter test
      - name: Build IPA
        script: |
          cd app
          flutter build ipa --release \
            --dart-define=OMR_BASE_URL=$OMR_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
